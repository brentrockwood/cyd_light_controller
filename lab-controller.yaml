esphome:
  name: lab-controller
  friendly_name: Lab Controller
  min_version: 2026.10.0
  on_boot:
    priority: 600
    then:
      - output.turn_on: backlight

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  id: ha_api
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: gpio
    pin: GPIO21
    id: backlight

font:
  - file: "gfonts://Roboto"
    id: reading_font
    size: 36
    glyphs: "0123456789.- °C%"
  - file: "gfonts://Roboto"
    id: label_font
    size: 18
    glyphs: " ABGHRTWacdefhiklmnoprtuy"

sensor:
  - platform: homeassistant
    id: desk_temperature
    entity_id: sensor.desk_temperature
    internal: true
  - platform: homeassistant
    id: desk_humidity
    entity_id: sensor.desk_humidity
    internal: true

text_sensor:
  - platform: homeassistant
    id: temperature_unit
    entity_id: sensor.desk_temperature
    attribute: unit_of_measurement
    internal: true

display:
  - platform: ili9xxx
    model: ILI9341
    id: screen
    spi_id: tft_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    dimensions:
      width: 320
      height: 240
    rotation: 180
    invert_colors: false
    color_palette: 8BIT
    color_order: RGB
    data_rate: 10MHz
    update_interval: 1s
    lambda: |-
      const Color white(255, 255, 255), black(0, 0, 0);
      const bool online = id(ha_api).is_connected_with_state_subscription();
      it.fill(Color(16, 20, 24));
      it.print(80, 24, id(label_font), white, TextAlign::CENTER, "Temperature");
      it.print(240, 24, id(label_font), white, TextAlign::CENTER, "Humidity");
      float celsius = id(desk_temperature).state;
      const auto &unit = id(temperature_unit).state;
      if (unit == "°F") celsius = (celsius - 32.0f) * 5.0f / 9.0f;
      if (online && std::isfinite(celsius) && (unit == "°C" || unit == "°F"))
        it.printf(80, 75, id(reading_font), white, TextAlign::CENTER, "%.1f°C", celsius);
      else
        it.print(80, 75, id(reading_font), white, TextAlign::CENTER, "--°C");
      const float humidity = id(desk_humidity).state;
      if (online && std::isfinite(humidity) && humidity >= 0 && humidity <= 100)
        it.printf(240, 75, id(reading_font), white, TextAlign::CENTER, "%.0f%%", humidity);
      else
        it.print(240, 75, id(reading_font), white, TextAlign::CENTER, "--%");
      if (!online)
        it.print(160, 132, id(label_font), white, TextAlign::CENTER, "HA offline");
      const char *labels[] = {"White", "Gold", "Red", "Black"};
      const Color backgrounds[] = {white, Color(255, 215, 0), Color(200, 0, 0), black};
      for (int i = 0; i < 4; i++) {
        const int x = 8 + i * 78;
        it.filled_rectangle(x, 160, 70, 70, backgrounds[i]);
        it.rectangle(x, 160, 70, 70, white);
        it.print(x + 35, 195, id(label_font), i < 2 ? black : white, TextAlign::CENTER, labels[i]);
      }

touchscreen:
  platform: xpt2046
  id: touch
  display: screen
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  threshold: 400
  # shortcut: reference-board calibration; measure this panel's corners before accepting touch accuracy.
  calibration:
    x_min: 340
    x_max: 3860
    y_min: 280
    y_max: 3860
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: false
  on_touch:
    - logger.log:
        format: "Touch x=%d y=%d raw_x=%d raw_y=%d"
        args: [touch.x, touch.y, touch.x_raw, touch.y_raw]

binary_sensor:
  - platform: touchscreen
    id: white_button
    internal: true
    x_min: 8
    x_max: 77
    y_min: 160
    y_max: 229
    on_press:
      - logger.log: "White pressed; requesting scene.bright_white_lab"
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: scene.bright_white_lab
  - platform: touchscreen
    id: gold_button
    internal: true
    x_min: 86
    x_max: 155
    y_min: 160
    y_max: 229
    on_press:
      - logger.log: "Gold pressed; requesting scene.golden_lab"
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: scene.golden_lab
  - platform: touchscreen
    id: red_button
    internal: true
    x_min: 164
    x_max: 233
    y_min: 160
    y_max: 229
    on_press:
      - logger.log: "Red pressed; requesting scene.red_lab"
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: scene.red_lab
  - platform: touchscreen
    id: black_button
    internal: true
    x_min: 242
    x_max: 311
    y_min: 160
    y_max: 229
    on_press:
      - logger.log: "Black pressed; requesting scene.night_lab"
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: scene.night_lab
